<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result | Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #020617;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #020617 60%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 32px;
            text-align: center;
            background: linear-gradient(135deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 40px;
            width: 100%;
            text-align: center;
            letter-spacing: 0.05em;
        }

        .status-safe {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.2);
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.1);
        }

        .status-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 20px 10px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .chart-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.08);
            border-color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Intelligence Report</h1>

            {% if status == "SAFE" %}
                <div class="status-badge status-safe">🛡️ ENVIRONMENT SECURE</div>
            {% else %}
                <div class="status-badge status-danger">⚠️ SECURITY BREACH DETECTED</div>
            {% endif %}

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Packets</div>
                    <div class="stat-value">{{ total }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Benign</div>
                    <div class="stat-value" style="color: var(--success)">{{ benign }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Attacks</div>
                    <div class="stat-value" style="color: var(--danger)">{{ attack }}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Detection Rate</div>
                    <div class="stat-value" style="color: var(--primary)">{{ rate }}%</div>
                </div>
            </div>

            <div class="chart-box">
                <div class="chart-container" style="width: 100%; height: 350px;">
                    <canvas id="resultChart"></canvas>
                </div>
            </div>

            <a href="/" class="btn-back">← Analyze New Traffic</a>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('resultChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Benign', 'Attack'],
                datasets: [{
                    label: 'Packet Count',
                    data: [{{ benign }}, {{ attack }}],
                    backgroundColor: ['#22c55e', '#ef4444'],
                    borderRadius: 8,
                    barThickness: 60
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        enabled: true,
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        titleFont: { family: 'Inter' },
                        bodyFont: { family: 'Inter' }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#64748b',
                            font: { family: 'Inter', size: 12 }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#94a3b8',
                            font: { family: 'Inter', size: 13, weight: '600' }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
